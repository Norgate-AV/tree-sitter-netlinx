name: Lint

on:
  push:
    branches: [master]
    paths:
      - grammar.js

  pull_request:
    paths:
      - grammar.js

  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: ${{vars.NODE_VERSION}}

      - name: Install modules
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint
