name: Publish packages

on:
  push:
    tags: ["v*"]

  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  test:
    name: Run Tests
    uses: ./.github/workflows/ci.yml

  changelog:
    name: Generate Changelog

    needs: test

    runs-on: ubuntu-latest

    outputs:
      release_notes: ${{ steps.release_notes.outputs.release_notes }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          # ref: master

      - name: Extract version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG_NAME=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION from tag: ${GITHUB_REF_NAME}"

      - name: Install Tools
        run: |
          # Install git-cliff and typos-cli using Cargo
          cargo install git-cliff
          cargo install typos-cli

          # Verify installations
          git-cliff --version
          typos --version

      - name: Generate changelog
        id: changelog
        run: |
          # Generate the changelog using git-cliff
          CHANGELOG_CONTENT=$(git-cliff)

          # Verify the changelog is not empty
          if [ -z "$CHANGELOG_CONTENT" ]; then
            exit 1
          fi

          # Save the changelog to an output variable
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG_CONTENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: release_notes
        run: |
          # Read the generated release notes into an output variable
          # Strip off everything before the first "###" header
          RELEASE_NOTES=$(git-cliff --current | sed -n '/^###/,$p')

          # Verify the release notes is not empty
          if [ -z "$RELEASE_NOTES" ]; then
            exit 1
          fi

          echo "release_notes<<EOF" >> $GITHUB_OUTPUT
          echo "$RELEASE_NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Switch to master and update CHANGELOG
        run: |
          # Switch to master (clean working tree, so this works)
          git fetch origin master
          git checkout master

          # NOW write the CHANGELOG to disk on the master branch
          echo '${{ steps.changelog.outputs.changelog }}' > CHANGELOG.md

      - name: Verify changelog generation
        run: |
          echo "Changelog output: ${{ steps.changelog.outputs.changelog }}"
          echo "Changelog file exists: $(ls -la CHANGELOG.md || echo 'File not found' && exit 1)"
          if [ -f "CHANGELOG.md" ]; then
            echo "Changelog content:"
            cat CHANGELOG.md
          fi

      - name: Commit changes back to the repository
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add CHANGELOG.md
          git commit -m "chore(release): update version to ${{ steps.get_version.outputs.VERSION }} [skip ci]"
          git push origin master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  github:
    name: Publish GitHub Release

    needs: [changelog]

    uses: ./.github/workflows/release.yml
    with:
      generate: true
      abi-version: "14"
      attestations: true
      release-body: ${{ needs.changelog.outputs.release_notes }}

  npm:
    name: Publish NPM package

    needs: [changelog, github]

    uses: ./.github/workflows/package-npm.yml
    secrets:
      NPM_TOKEN: ${{secrets.NPM_TOKEN}}
    with:
      generate: true
      abi-version: "14"

  crates:
    name: Publish Crates package

    needs: [changelog, github]

    uses: ./.github/workflows/package-crates.yml
    secrets:
      CARGO_REGISTRY_TOKEN: ${{secrets.CARGO_REGISTRY_TOKEN}}
    with:
      generate: false
      abi-version: "14"

  pypi:
    name: Publish PyPI package

    needs: [changelog, github]

    uses: ./.github/workflows/package-pypi.yml
    secrets:
      PYPI_API_TOKEN: ${{secrets.PYPI_API_TOKEN}}
    with:
      generate: true
      abi-version: "14"
