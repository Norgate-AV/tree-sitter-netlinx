name: Publish packages

on:
  push:
    tags: ["v*"]

  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  test:
    name: Run Tests
    uses: ./.github/workflows/ci.yml

  changelog:
    name: Generate Changelog

    needs: test

    runs-on: ubuntu-latest

    outputs:
      changelog: ${{ steps.changelog.outputs.changelog }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: master

      - name: Extract version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Generate changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v4
        with:
          configuration: ".github/changelog-config.json"
          outputFile: "CHANGELOG.md"
          ignorePreReleases: "false"
          fromTag: ""
          toTag: "${{ github.ref_name }}"
          failOnError: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify changelog generation
        run: |
          echo "Changelog output: ${{ steps.changelog.outputs.changelog }}"
          echo "Changelog file exists: $(ls -la CHANGELOG.md || echo 'File not found')"
          if [ -f "CHANGELOG.md" ]; then
            echo "Changelog content:"
            cat CHANGELOG.md
          fi

      - name: Commit changes back to the repository
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add CHANGELOG.md
          git commit -m "chore: update version to ${{ steps.get_version.outputs.VERSION }} [skip ci]"
          git push origin master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  github:
    name: Publish GitHub Release

    needs: changelog

    uses: tree-sitter/workflows/.github/workflows/release.yml@main
    with:
      generate: true
      attestations: true
      # body: ${{ step.changelog.outputs.changelog }}

  npm:
    name: Publish NPM package

    needs: changelog

    uses: tree-sitter/workflows/.github/workflows/package-npm.yml@main
    secrets:
      NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}
    with:
      generate: true

  crates:
    name: Publish Crates package

    needs: changelog

    uses: tree-sitter/workflows/.github/workflows/package-crates.yml@main
    secrets:
      CARGO_REGISTRY_TOKEN: ${{secrets.CARGO_REGISTRY_TOKEN}}
    with:
      generate: true

  pypi:
    name: Publish PyPI package

    needs: changelog

    uses: tree-sitter/workflows/.github/workflows/package-pypi.yml@main
    secrets:
      PYPI_API_TOKEN: ${{secrets.PYPI_API_TOKEN}}
    with:
      generate: true
